
# ============================================================
# .github/workflows/links.yml (ALL-REPOS)
# ============================================================
# Updated: 2026-11-23
#
# WHAT: A GitHub Actions workflow that checks project links.
#
# WHEN: Runs on pull requests, monthly, or manually.
#
# WHY: Helps ensure documentation links remain accessible.
#
# TOOL: Lychee link checker.
# CONFIG: .github/lychee.toml
#
# CUSTOMIZATION:
# Check Markdown documentation only.
# Exclude downloaded HTML and raw source data.
# ============================================================

name: Check Links

on:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    name: Link checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # === ASSEMBLE ===

      - name: A1) Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # === BASIC CHECKS ===

      - name: B1) Check repository links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >
            --config .github/lychee.toml
            --no-progress
            './**/*.md'
